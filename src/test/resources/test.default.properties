
# --- Default Test Properties -------------------------------------------
#
# These properties are set by default in test config as they are required for some tests.
# Can still be overridden by test.app.properties if need be
#
# Note: this file is for test use only. Do not commit any sensitive property values here.
# Furthermore, do not use these same property values in app.properties for your deployment.

# Required for web tests
auth.enabled=false
auth.master.pass=test-master-pass

# Required for redmine api tests
auth.redmine.enabled=true
auth.redmine.api.key=test-redmine-key-12345678901234567890

# Disable the IP whitelist for authentication testing
auth.api.ip.whitelist = ^$

